[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shamaran"
version = "0.1.0"
description = "A secure, local-first AI agent for your computer and projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashkan Allahveisi" }]
maintainers = [{ name = "Ashkan Allahveisi" }]
keywords = ["ai-agent", "ollama", "local-first", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
shamaran = "shamaran.cli:app"

[project.urls]
Homepage = "https://github.com/ashkanWaisi/shamaran"
Repository = "https://github.com/ashkanWaisi/shamaran"
Issues = "https://github.com/ashkanWaisi/shamaran/issues"
Changelog = "https://github.com/ashkanWaisi/shamaran/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ashkanWaisi/shamaran#readme"
Security = "https://github.com/ashkanWaisi/shamaran/security/policy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["shamaran"]
